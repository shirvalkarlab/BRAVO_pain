services:
  bravo-server:
    image: bravo-server-fork:local
    build:
      context: .
      dockerfile: dockerfile.dev
    # Dev: mount live code + freshly-built client so changes apply without an image rebuild
    # (DEBUG runserver auto-reloads Python; nginx serves the mounted client build).
    volumes:
      - ./BRAVO:/usr/src/BRAVO
      - ./Client/build:/usr/share/nginx/html
      - ./BRAVO/bravo_nginx.dev.conf:/etc/nginx/sites-enabled/default
    # Local REDCap credentials (gitignored secrets/redcap.env). Provides REDCAP_API_URL /
    # REDCAP_API_TOKEN so the Biomarkers module can pull real PRO surveys.
    env_file:
      - ./secrets/redcap.env
    # Dev-only: auto-start the Operon agent bridge (in-container command watcher on the
    # ./BRAVO bind mount), then run the normal nginx+migrate+gunicorn startup. The watcher
    # lets the sandboxed agent execute jobs in this container without the Docker socket.
    # boot.sh execs the same gunicorn line as the base image's command, so behavior is
    # otherwise identical. Lives in the dev override only — the prod image is untouched.
    command: ["bash", "/usr/src/BRAVO/_agent_bridge/boot.sh"]
