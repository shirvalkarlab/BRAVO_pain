services:
  bravo-server:
    image: bravo-server-fork:local
    build:
      context: .
      dockerfile: dockerfile.dev
    # Dev: mount live code + freshly-built client so changes apply without an image rebuild
    # (DEBUG runserver auto-reloads Python; nginx serves the mounted client build).
    volumes:
      - ./BRAVO:/usr/src/BRAVO
      - ./Client/build:/usr/share/nginx/html
      - ./BRAVO/bravo_nginx.dev.conf:/etc/nginx/sites-enabled/default
    # Local REDCap credentials (gitignored secrets/redcap.env). Provides REDCAP_API_URL /
    # REDCAP_API_TOKEN so the Biomarkers module can pull real PRO surveys.
    env_file:
      - ./secrets/redcap.env
