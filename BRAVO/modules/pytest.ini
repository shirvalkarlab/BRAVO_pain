# The host suite's pytest configuration (2026-09-12). It is run from this directory:
#   cd BRAVO/modules && PYTHONPATH=. python3 -B -m pytest \
#       ClosedLoopDeployment/tests StimOptimizer/tests CacheStore/tests DecodeCommon/tests -q -W ignore
# and, since 2026-09-12, by `_agent_bridge/run_both_suites.sh` across cores (pytest-xdist) with the
# two markers below deciding which tests leave the routine parallel pass. The Biomarkers tests are
# NOT run by pytest: `_agent_bridge/run_tests.py` calls them in the container and honours the same
# `live` marker by reading `pytestmark` off each function.
[pytest]
markers =
    store: reads or writes the PRODUCTION cache store or the live database; run serially, never under xdist
    live: reads the live RCS08 record (skips when the participant is absent); left out of the routine run and run once a day
