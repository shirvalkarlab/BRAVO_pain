name: CI

# What this does and does not cover, stated plainly (CLAUDE.md's own rule: an accurate gap beats a
# silent one). Three of this project's four real test surfaces run here:
#
#   - the HOST suite: ClosedLoopDeployment, StimOptimizer, CacheStore, DecodeCommon, ControlAnalyses (pytest).
#     Verified directly before this file was written: a plain `pip install` of the packages below,
#     on Python 3.12 (matching the live container's 3.12.3), runs it clean with no database, no
#     Redis and no R -- 1185 passed, 3 skipped, 0 failed. None of those four packages import
#     Biomarkers, and Biomarkers is the only thing in this repository that needs rpy2/pymer4/R or a
#     live MySQL connection, so leaving those out is not a shortcut, it is what the import graph
#     already is.
#   - the frontend build (`Client/`), the same command CLAUDE.md's Quick Reference gives.
#   - the page tests (`npm test`, Jest), added 2026-09-23 once the last two known-failing page
#     tests were repaired (decision 250): 226 of 226 across 34 suites at that point.
#
#   NOT covered: the CONTAINER suite (Biomarkers + CacheStore + DecodeCommon, run inside the
#   `bravo-server` OrbStack container against MySQL/Redis/R/rpy2/pymer4 and, for the `live` marker,
#   the real participant record) -- reproducing that here would mean standing up MySQL, Redis, an R
#   toolchain and rpy2/pymer4 in the runner, which is real infrastructure work, not "simple." It
#   stays a manual step (`_agent_bridge/run_tests.py` in the live container) until someone decides
#   to build that. Until 2026-09-23 `npm test` (Jest) was left out too, because two page tests
#   had been failing since 2026-09-11 (decision 147) and a step that starts red teaches everyone
#   to ignore it; both were repaired in decision 250, so it runs now.
#
# There is still no linter or type checker configured for this project (CLAUDE.md says so on
# purpose), so this file adds none.

on:
  push:
    branches: [v3.1.0, PS_closedloop_deployment, development]
  pull_request:

jobs:
  host-tests:
    name: Host test suite (ClosedLoopDeployment, StimOptimizer, CacheStore, DecodeCommon, ControlAnalyses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The versions below are copied from BRAVO/requirements.txt. Two lines are left out on
        # purpose -- pymer4 (needs R + rpy2, apt-installed at the OS level in the real container)
        # and mysqlclient (needs libmysqlclient's headers to build) -- because the four packages
        # this job tests never import either, as verified above. The three Google packages are
        # the ones StimOptimizer/tests/test_google_sheets_credentials.py imports; their absence
        # kept this job red from 2026-09-16 to 2026-09-20 (34 runs) on two tests. numba runs the
        # design rule's compiled filter and its equality test against the numpy loop (decision 269).
        run: |
          python -m pip install --upgrade pip
          pip install \
            django==5.1.3 djangorestframework==3.15.2 django-cors-headers==4.6.0 \
            numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2 statsmodels==0.14.6 pandas==2.2.3 \
            numba==0.61.2 llvmlite==0.44.0 \
            requests==2.32.3 pymysql==1.1.1 psutil==7.0.0 pywavelets==1.8.0 filelock==3.16.1 \
            plotly==7.0.0 pyarrow==17.0.0 \
            google-api-python-client==2.149.0 google-auth==2.35.0 google-auth-httplib2==0.2.0 \
            pytest pytest-xdist

      - name: Run the host suite
        # Mirrors CLAUDE.md's own command. The `store` marker is left out because it touches a real
        # database/production cache store this job has neither; `live` because it reads the real
        # participant record, reachable only from the live container.
        working-directory: BRAVO/modules
        run: |
          PYTHONPATH=. python -B -m pytest \
            ClosedLoopDeployment/tests StimOptimizer/tests CacheStore/tests DecodeCommon/tests ControlAnalyses/tests \
            -q -W ignore -m "not store and not live"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        working-directory: Client
        run: npm ci

      - name: Page tests
        # Every jest suite under Client/src, once, no watcher. CI=true is what makes react-scripts
        # run them once and exit non-zero on a failure.
        working-directory: Client
        run: CI=true npx react-scripts test --watchAll=false

      - name: Build
        # The exact command from CLAUDE.md's Quick Reference: CI=false so react-scripts treats a
        # warning as a warning, not a build-breaking error; no source maps in the committed bundle.
        working-directory: Client
        run: CI=false GENERATE_SOURCEMAP=false npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and run gitleaks
        # The gitleaks CLI itself is free (MIT). The `gitleaks/gitleaks-action` wrapper is not --
        # its v2 gates organization repositories behind a paid license ("license key is required")
        # -- so this installs and runs the open-source binary directly instead of that wrapper.
        #
        # --no-git scans the CHECKED-OUT FILES, not the 1,288-commit history: walking the whole
        # history took about 30 minutes and re-found the same ten already-known, already-checked
        # upstream example keys (docs/installation.rst, jackson.cagle@gmail.com, 2022-2024, before
        # this lab's fork) under a DIFFERENT fingerprint each time (history mode prefixes the
        # commit hash, so the four this file's own .gitleaksignore names never matched there). What
        # actually matters for this job -- whether a new secret is in what's about to be pushed --
        # only needs the working tree, which is also the only thing .gitleaksignore's fingerprints
        # (no commit hash) are written to match.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact -v
