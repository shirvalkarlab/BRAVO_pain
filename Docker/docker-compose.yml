version: "3.9"
services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "ROOTPASSWORD"
      MYSQL_DATABASE: "BRAVOServer"
      MYSQL_USER: "BRAVOAdmin"
      MYSQL_PASSWORD: "AdminPassword"
    ports:
      - '3306:3306'
    volumes:
      - SQLDatabase:/var/lib/mysql
    networks:
      - backend
  
  redis:
    image: redis:5
    restart: always
    # BOUND THE MEMORY AND GIVE REDIS A REAL EVICTION POLICY. Added 2026-09-06 at the PI's
    # instruction. Same change as in the repository-root docker-compose.yml, applied here too
    # because both files define a redis service and which one is deployed depends on how the
    # stack was brought up. redis:5 starts with maxmemory=0 (unlimited) and
    # maxmemory-policy=noeviction, so when the host fills it REFUSES NEW WRITES instead of
    # dropping old entries, on a machine shared with MySQL and the four application workers.
    #
    # 512mb suits what this instance is for: build locks, cache freshness keys, and Django's
    # small cache values. Large spectrum payloads stay as files -- measured faster from the
    # filesystem than through Redis, since they are already in the operating system's page cache.
    #
    # allkeys-lru rather than volatile-lru, because volatile-lru only evicts keys with an expiry
    # and one key written without one could refill the instance and restore the write-refusal wall.
    #
    # NOTE the RedisDatabase volume below: snapshotting is unaffected by this command override,
    # since redis-server keeps its built-in save points when only these two flags are passed.
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - RedisDatabase:/data
    ports:
      - '6379:6379'
    networks:
      - backend
  
  bravo-server:
    image: jcagle95/bravo-server:latest
    restart: on-failure

    environment:
      BRAVO_DATABASE: "BRAVOServer"
      BRAVO_DATABASE_USER: "BRAVOAdmin"
      BRAVO_DATABASE_PASSWORD: "AdminPassword"
      BRAVO_DATABASE_HOST: "mysql"
      BRAVO_DATABASE_PORT: "3306"

      REDIS_HOST: "redis"
      ENCRYPTION_KEY: "O6sHoRxTt3dYohP0kndr6rvFl8ebxZbELT9wKI2FICk="
      SECRET_KEY: "django-insecure-v#aagfodpaihopfda#$$%()I*()RETGEDRF*()a+"
      SERVER_ADDRESS: "localhost"
      CLIENT_ADDRESS: "http://localhost:80"
      MODE: "DEBUG"

    stdin_open: true
    tty: true
    depends_on:
      - mysql
      - redis
    volumes:
      - BRAVOStorage:/usr/src/BRAVO/BRAVOStorage
    networks:
      - backend
      - frontend
    ports:
      - '3001:3001'
    command: >
      bash -c "env >> /etc/environment && python3 manage.py migrate && cron && daphne -p 3001 -b 0.0.0.0 BRAVO.asgi:application"

  bravo-client:
    image: jcagle95/bravo-client:latest
    restart: on-failure

    depends_on:
      - bravo-server
    networks:
      - frontend
    ports:
      - '80:80'

networks:
  frontend:
  backend:

volumes:
  RedisDatabase:
  SQLDatabase:
  BRAVOStorage: 