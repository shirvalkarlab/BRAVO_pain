[project]
name="bravo-pain-aditya-jetstream"
version="0.1.0"
requires-python=">=3.12,<3.13"
dependencies=[
  "avro==1.12.0",
  "boto3[crt]==1.40.21",
  "cryptography==44.0.0",
  "django>=5.2,<5.3",
  "djangorestframework==3.15.2",
  "django-cors-headers==4.6.0",
  "filelock==3.16.1",
  "blosc2==3.3.3",
  "numpy==2.1.3",
  "scipy==1.14.1",
  "numba==0.61.2",
  "llvmlite==0.44.0",
  "scikit-learn==1.5.2",
  "statsmodels==0.14.6",
  "seaborn==0.13.2",
  "pandas==2.2.3",
  "spectrum==0.8.1",
  "specparam==2.0.0rc2",
  "requests==2.32.3",
  "pymysql==1.1.1",
  "psutil==7.0.0",
  "whitenoise==6.7.0",
  "waitress==3.0.2",
  "setuptools==75.8.0",
  "pywavelets==1.8.0",
  "nibabel==5.3.2",
  "PyCap==2.6.0",
  "plotly==7.0.0",
  "pyarrow==17.0.0",
  "openpyxl==3.1.5",
  "google-api-python-client==2.149.0",
  "google-auth==2.35.0",
  "google-auth-httplib2==0.2.0",
  "fonttools==4.60.2",
  "joblib==1.5.3",
  "msgpack==1.2.1",
  "mne==1.12.1",
  "mne-bids==0.19.0",
  "pybv==0.8.1",
  "edfio==0.4.16",
  "openai==3.0.0",
  "pytz==2026.2",
  "pygments==2.20.0",
  "pillow==12.3.0",
  "sqlparse==0.5.4",
  "uvicorn==0.49.0",
  "urllib3==2.7.0",
  "zarr==3.2.1",
  "zstandard==0.25.0",
  "redis>=5,<6",
  "gunicorn>=23,<24"
]
[project.optional-dependencies]
production=["mysqlclient>=2.2.1,<3", "pymer4==0.8.2", "rpy2==3.5.15"]
offline-snapshots=["sqlalchemy>=2,<3"]
offline-training=["sqlalchemy>=2,<3", "d3rlpy==2.8.1", "torch==2.8.0"]
[dependency-groups]
dev=["pytest>=8,<9","pytest-xdist>=3,<4","pytest-cov>=6,<7","sqlalchemy>=2,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# CPU wheels keep the optional dataset-adapter CI gate independent of CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'", extra = "offline-training" }]
