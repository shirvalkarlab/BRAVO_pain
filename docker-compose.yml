version: "3.9"
services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "ROOTPASSWORD"
      MYSQL_DATABASE: "BRAVOServer"
      MYSQL_USER: "BRAVOAdmin"
      MYSQL_PASSWORD: "AdminPassword"
    ports:
      - '3306:3306'
    volumes:
      - SQLDatabase:/var/lib/mysql
    networks:
      - backend
  
  bravo-server:
    image: jcagle95/bravo-server:3.0.1
    restart: always
    environment:
      BRAVO_DATABASE: "BRAVOServer"
      BRAVO_DATABASE_USER: "BRAVOAdmin"
      BRAVO_DATABASE_PASSWORD: "AdminPassword"
      BRAVO_DATABASE_HOST: "mysql"
      BRAVO_DATABASE_PORT: "3306"

      REDIS_HOST: "redis"
      DATASERVER_ENCRYPTION: "O6sHoRxTt3dYohP0kndr6rvFl8ebxZbELT9wKI2FICk="
      DATASERVER_HASHKEY: "BRAVOServerHashkey="
      DJANGO_SECRET_KEY: "django-insecure-v#aagfodpaihopfda#$$%()I*()RETGEDRF*()a+"
      SERVER_ADDRESS: "http://localhost:27286"
      SERVER_HOST: "localhost"
      DJANGO_MODE: "DEBUG"

      FIBIT_CLIENT_SECRET: ""
      FIBIT_CLIENT_ID: ""
      
    stdin_open: true
    tty: true
    depends_on:
      - mysql
      - redis
    networks:
      - backend
    volumes:
      - BRAVOStorage:/usr/src/BRAVO/BRAVOStorage
    ports:
      - '80:80'
      - '443:443'
      - '27286:27286'
    # Multi-worker ASGI (gunicorn + uvicorn workers) instead of single-thread runserver, so
    # concurrent Percept uploads decode in parallel rather than queueing. Workers capped at 4
    # ($$(( $$(nproc) < 4 ? $$(nproc) : 4 )) — $$ escapes $ so bash, not compose, expands it).
    # nproc=16 on the lab Mac caused RAM exhaustion after a few --reload cycles; 4 workers cover
    # all realistic concurrent dev load and stay well under 2 GiB. --timeout 600 tolerates the
    # slow synchronous JSON decode of large sessions.
    command: >
      bash -c "env >> /etc/environment && service nginx start && python3 manage.py migrate &&
      gunicorn BRAVO.asgi:application -k uvicorn.workers.UvicornWorker
      -w $$(( $$(nproc) < 4 ? $$(nproc) : 4 ))
      -b 0.0.0.0:27286 --timeout 600 --graceful-timeout 30 --reload
      --access-logfile - --error-logfile -"
  
  redis:
    image: redis:5
    restart: always
    ports:
      - '6379:6379'
    networks:
      - backend

networks:
  backend:

volumes:
  SQLDatabase:
    name: sqldata
  BRAVOStorage: 