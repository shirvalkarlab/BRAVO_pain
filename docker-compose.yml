# Validate with: docker compose --env-file .env.jetstream config --quiet
# These dedicated bind mounts must never target another BRAVO's storage.
name: bravo-aditya-jetstream
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a new private root password}
      MYSQL_DATABASE: bravo_aditya
      MYSQL_USER: bravo_aditya
      MYSQL_PASSWORD: ${BRAVO_DATABASE_PASSWORD:?Set a new private database password}
    volumes:
      - ${BRAVO_DB_DIRECTORY:?Set dedicated database directory}:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [private]
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --maxmemory, 512mb, --maxmemory-policy, allkeys-lru]
    networks: [private]
  app:
    image: bravo-aditya-backend:${BUILD_REVISION:?Set accepted Git commit}
    build:
      context: .
      dockerfile: dockerfile
      target: backend
      args:
        BUILD_REVISION: ${BUILD_REVISION}
    restart: unless-stopped
    environment:
      BRAVO_DATABASE: bravo_aditya
      BRAVO_DATABASE_USER: bravo_aditya
      BRAVO_DATABASE_PASSWORD: ${BRAVO_DATABASE_PASSWORD}
      BRAVO_DATABASE_HOST: mysql
      BRAVO_DATABASE_PORT: "3306"
      REDIS_HOST: redis
      DATASERVER_PATH: /data/bravo/
      DATASERVER_ENCRYPTION: ${DATASERVER_ENCRYPTION:?Set private Fernet key}
      DATASERVER_HASHKEY: ${DATASERVER_HASHKEY:?Set private hashing key}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set private Django secret}
      SERVER_HOST: ${BRAVO_DOMAIN:?Set verified public DNS hostname}
      SERVER_ADDRESS: https://${BRAVO_DOMAIN}
      DJANGO_MODE: PRODUCTION
      DJANGO_SETTINGS_MODULE: BRAVO.jetstream_settings
      BRAVO_TRUSTED_PROXY_CIDRS: ${BRAVO_PROXY_IP:-172.29.240.3}/32
      BRAVO_CLINICAL_CONFIG_FILE: /run/bravo-private/clinical.json
      BRAVO_DEVICE_FACTS_DIR: /run/bravo-private/device-facts
      BRAVO_POWER_CEILING_CONFIG_DIR: /run/bravo-private/power-ceilings
      BRAVO_BETA_PEAK_MODEL_DIR: /run/bravo-private/beta-peak-models
      BRAVO_ADITYA_PRESENTATION_METADATA: /run/bravo-private/aditya-presentation.json
      BRAVO_CALIBRATION_DIR: /run/bravo-private/calibration
      # Optional provider credentials; blank keeps that connection unavailable.
      REDCAP_API_URL: ${REDCAP_API_URL:-}
      REDCAP_API_TOKEN: ${REDCAP_API_TOKEN:-}
      BRAVO_PT_CONFIG_DIR: /run/bravo-private/participant-config
      BRAVO_OURA_MANAGED_CONFIG_FILE: ${BRAVO_OURA_MANAGED_CONFIG_FILE:-}
      BRAVO_MANUAL_SYNC_CONFIG_FILE: ${BRAVO_MANUAL_SYNC_CONFIG_FILE:-}
      FIBIT_CLIENT_ID: ${FIBIT_CLIENT_ID:-}
      FIBIT_CLIENT_SECRET: ${FIBIT_CLIENT_SECRET:-}
      GoogleHealth_CLIENT_ID: ${GoogleHealth_CLIENT_ID:-}
      GoogleHealth_CLIENT_SECRET: ${GoogleHealth_CLIENT_SECRET:-}
      GoogleHealth_CLIENT_REDIRECT_URI: ${GoogleHealth_CLIENT_REDIRECT_URI:-}
      SAVED_ANSWERS_REFRESH: "0"
      BRAVO_WEB_WORKERS: ${BRAVO_WEB_WORKERS:-4}
      BRAVO_POOL_JOBS: ${BRAVO_POOL_JOBS:-4}
    volumes:
      - ${BRAVO_DATA_DIRECTORY:?Set dedicated BRAVO data directory}:/data/bravo
      - ${BRAVO_PRIVATE_DIRECTORY:?Set dedicated private configuration directory}:/run/bravo-private:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [private, egress]
  web:
    image: bravo-aditya-web:${BUILD_REVISION}
    build:
      context: .
      dockerfile: dockerfile
      target: web
      args:
        BUILD_REVISION: ${BUILD_REVISION}
    restart: unless-stopped
    environment:
      BRAVO_DOMAIN: ${BRAVO_DOMAIN}
    ports: ["${BRAVO_BIND_ADDRESS:-0.0.0.0}:80:80", "${BRAVO_BIND_ADDRESS:-0.0.0.0}:443:443", "${BRAVO_BIND_ADDRESS:-0.0.0.0}:443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks:
      egress:
        ipv4_address: ${BRAVO_PROXY_IP:-172.29.240.3}
networks:
  private:
    internal: true
  egress:
    ipam:
      config:
        - subnet: ${BRAVO_PROXY_SUBNET:-172.29.240.0/28}
volumes:
  caddy_data:
  caddy_config:
